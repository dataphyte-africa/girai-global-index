# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

env:
  # Public — available at build and runtime
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: wwnfg3le
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SANITY_API_VERSION
    value: "2024-10-01"
    availability:
      - BUILD
      - RUNTIME

  # PostHog analytics. NEXT_PUBLIC_* vars are inlined into the client bundle at
  # BUILD time, so BOTH must be available at BUILD (not just RUNTIME) or the
  # browser SDK never initializes. The project API key is publishable (it ships
  # in the client bundle regardless); kept as a secret only for tidy management.
  # Set it before deploying:
  #   firebase apphosting:secrets:set NEXT_PUBLIC_POSTHOG_KEY
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    secret: NEXT_PUBLIC_POSTHOG_KEY
    availability:
      - BUILD
      - RUNTIME

  # Region host — use https://eu.i.posthog.com if the project lives on EU Cloud.
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://us.i.posthog.com
    availability:
      - BUILD
      - RUNTIME

  - variable: OPENAI_VECTOR_STORE_ID
    value: vs_6a3a6e41c3548191b72539d24aa60b0b
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_SHEETS_SHEET_NAME
    value: Submissions
    availability:
      - RUNTIME

  # Reports are shipped in the app bundle and served from /public/downloads
  # (see firebase.json — the report PDFs are NOT excluded from the deploy).
  - variable: DOWNLOAD_FIRST_REPORT_PATH
    value: /downloads/GIRAI-2024-report.pdf
    availability:
      - RUNTIME

  - variable: DOWNLOAD_SECOND_REPORT_PATH
    value: /downloads/Global-Index-on-Responsible-AI-2026.pdf
    availability:
      - RUNTIME

  - variable: DOWNLOAD_FIRST_DATA_PATH
    value: https://storage.googleapis.com/girai-global-index-downloads/GIRAI_2024_dataset.xlsx
    availability:
      - RUNTIME

  - variable: DOWNLOAD_SECOND_DATA_PATH
    value: https://storage.googleapis.com/girai-global-index-downloads/GIRAI_2026_dataset.xlsx
    availability:
      - RUNTIME

  # Server-only secrets (Cloud Secret Manager)
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME

  - variable: SANITY_API_READ_TOKEN
    secret: SANITY_API_READ_TOKEN
    availability:
      - BUILD
      - RUNTIME

  - variable: SANITY_REVALIDATE_SECRET
    secret: SANITY_REVALIDATE_SECRET
    availability:
      - RUNTIME

  # Download logging -> Google Sheets (Apps Script web app).
  # Set the secret BEFORE deploying, or the deploy will fail:
  #   firebase apphosting:secrets:set GOOGLE_SHEETS_WEB_APP_URL --data-file - --force
  # (paste the /exec URL, then Ctrl-D). See scripts/google-sheets-download-logger.gs.
  - variable: GOOGLE_SHEETS_WEB_APP_URL
    secret: GOOGLE_SHEETS_WEB_APP_URL
    availability:
      - RUNTIME
